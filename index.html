<title>tavor-mind</title>
<script>
  // spa-github-pages: decode the path from 404.html's redirect query string
  // back into a real URL before React Router boots.
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);
</script>
</head>

</body>
